<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>어떻게 검증했는가 — Codebase Assistant</title>
<style>
/* ============================================================================
   이 페이지가 존재하는 이유

   이 프로젝트의 차별점은 챗봇이 아니라 **평가 체계**다. 그런데 그 결과가 전부
   docs/*.md 안에만 있어서, 화면을 3분 보는 사람에게는 "출처 붙는 RAG 챗봇" 하나로만
   보였다. 가장 강한 자산이 비가시였다 — 그걸 화면으로 끌어온다.

   디자인 토큰은 index.html 과 같은 값을 쓴다(외부 의존 0, 단일 파일 유지).
   ========================================================================== */
:root {
  --c-bg:#f7f8fa; --c-surface:#ffffff; --c-border:#e3e6ec; --c-border-str:#cbd2dd;
  --c-text:#16191f; --c-text-dim:#5b6472; --c-text-mute:#8b94a3;
  --c-accent:#3b5bdb; --c-accent-sub:#eaeeff;
  --c-ok:#2f9e44; --c-ok-bg:#e9f7ec;
  --c-warn:#e03131; --c-warn-bg:#fdecec;
  --c-info:#1c7ed6; --c-info-bg:#e7f2fd;
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-full:999px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px;
  --shadow-1:0 1px 2px rgba(16,24,40,.05);
  --font:-apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Apple SD Gothic Neo",
         "Malgun Gothic", Roboto, sans-serif;
  --font-mono:"SFMono-Regular","JetBrains Mono",Consolas,"D2Coding",monospace;
  --max:1080px;
}
/* 화면 밝기는 챗봇 화면에서 고른 값을 그대로 따른다(head 안의 짧은 조각이 적용한다).
   여기에 토글을 또 두지 않는 이유는, 같은 설정을 두 곳에서 바꾸면 어느 쪽이 이기는지
   사용자가 알 수 없기 때문이다. 고르는 곳은 한 군데다. */
:root[data-theme="dark"] {
  color-scheme: dark;
  --c-bg:#0f1115; --c-surface:#161a21; --c-border:#262c37; --c-border-str:#39424f;
  --c-text:#e6e9ef; --c-text-dim:#a3acbb; --c-text-mute:#727d8d;
  --c-accent:#748ffc; --c-accent-sub:#1e2540;
  --c-ok:#51cf66; --c-ok-bg:#132a19;
  --c-warn:#ff8787; --c-warn-bg:#37191c;
  --c-info:#4dabf7; --c-info-bg:#132437;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
}

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--c-bg); color:var(--c-text);
  font-family:var(--font); font-size:15px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
  word-break:keep-all; overflow-wrap:anywhere;
}
a{color:var(--c-accent)}
:focus-visible{outline:2px solid var(--c-accent); outline-offset:2px; border-radius:var(--r-sm)}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

.wrap{max-width:var(--max); margin:0 auto; padding:var(--s-6) var(--s-4) 80px}

/* --- 헤더 --- */
.top{display:flex; align-items:flex-start; justify-content:space-between; gap:var(--s-4); flex-wrap:wrap}
h1{font-size:26px; margin:0 0 var(--s-2); letter-spacing:-.01em}
.lede{color:var(--c-text-dim); margin:0; max-width:60ch}
.back{
  display:inline-flex; align-items:center; gap:6px; text-decoration:none;
  border:1px solid var(--c-border); border-radius:var(--r-full);
  padding:6px 14px; font-size:13px; color:var(--c-text-dim); background:var(--c-surface);
  white-space:nowrap;
}
.back:hover{border-color:var(--c-border-str); color:var(--c-text)}

/* 스냅샷 고지 — 지금 잰 값이 아닐 수 있다는 것을 감추지 않는다 */
.stamp{
  margin:var(--s-4) 0 var(--s-5); padding:10px 14px; font-size:12.5px;
  border:1px solid var(--c-border); border-left:3px solid var(--c-info);
  border-radius:var(--r-md); background:var(--c-surface); color:var(--c-text-dim);
}
.stamp code{font-family:var(--font-mono); font-size:11.5px}

section{margin-top:var(--s-6)}
h2{font-size:19px; margin:0 0 6px; letter-spacing:-.01em}
h2 .num{color:var(--c-text-mute); font-weight:400; font-size:14px; margin-left:6px}
.sub{color:var(--c-text-dim); font-size:13.5px; margin:0 0 var(--s-4); max-width:72ch}

.card{
  background:var(--c-surface); border:1px solid var(--c-border);
  border-radius:var(--r-lg); padding:var(--s-4); box-shadow:var(--shadow-1);
  margin-bottom:var(--s-3);
}
.card > h3{font-size:15px; margin:0 0 2px}
.card > .meta{font-size:12px; color:var(--c-text-mute); margin:0 0 var(--s-3)}

/* 표 — 넓으면 가로 스크롤(본문이 밀리지 않게) */
.tw{overflow-x:auto; -webkit-overflow-scrolling:touch}
table{width:100%; border-collapse:collapse; font-size:13px; min-width:440px}
th,td{padding:7px 10px; border-bottom:1px solid var(--c-border); text-align:left; white-space:nowrap}
th{color:var(--c-text-mute); font-weight:600; font-size:12px}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
tr.best td{background:var(--c-accent-sub); font-weight:600}
tr.best td:first-child::after{content:" ← 운영"; color:var(--c-accent); font-weight:400; font-size:11px}
.mono{font-family:var(--font-mono); font-size:12px}
code.mono{background:var(--c-accent-sub); border-radius:var(--r-sm); padding:1px 5px}

.pill{
  display:inline-block; padding:1px 8px; border-radius:var(--r-full);
  font-size:11.5px; font-weight:600; white-space:nowrap;
}
.pill.ok{background:var(--c-ok-bg); color:var(--c-ok)}
.pill.warn{background:var(--c-warn-bg); color:var(--c-warn)}
.pill.info{background:var(--c-info-bg); color:var(--c-info)}

/* 원래 용어 — 쉬운 말 뒤에 작게. 챗봇 화면(web/index.html)의 `.term` 과 같은 규칙이다.
   두 화면이 용어를 다르게 다루면 같은 제품으로 읽히지 않는다. */
.term{font-size:10.5px; font-weight:400; color:var(--c-text-mute);
      border:1px solid var(--c-border); border-radius:6px; padding:1px 5px;
      margin-left:4px; white-space:nowrap}

/* 핵심 수치 타일 */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:var(--s-3); margin-bottom:var(--s-4)}
.tile{background:var(--c-surface); border:1px solid var(--c-border); border-radius:var(--r-md); padding:var(--s-3) var(--s-4)}
.tile .v{font-size:26px; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.tile .k{font-size:12px; color:var(--c-text-mute); margin-top:2px}
.tile .n{font-size:11.5px; color:var(--c-text-dim); margin-top:6px; line-height:1.45; white-space:normal}

/* 경고/해석 블록 — 수치 옆에 조건을 붙여 말한다 */
.note{
  margin-top:var(--s-3); padding:10px 12px; font-size:12.5px; line-height:1.6;
  border-radius:var(--r-md); background:var(--c-warn-bg); color:var(--c-text);
  border:1px solid color-mix(in srgb, var(--c-warn) 25%, transparent);
}
.note.plain{background:var(--c-surface); border-color:var(--c-border); color:var(--c-text-dim)}
.note b{color:var(--c-warn)}
.note.plain b{color:var(--c-text)}

/* 판단 목록 */
.dec{border-left:3px solid var(--c-border-str)}
.dec.reject{border-left-color:var(--c-warn)}
.dec.adopt{border-left-color:var(--c-ok)}
.dec-head{display:flex; align-items:baseline; gap:var(--s-2); flex-wrap:wrap; margin-bottom:6px}
.dec-head h3{margin:0; font-size:15px}
/* 제목 뒤에 붙는 원래 용어 — 제목 글자보다 작고 조용하게. */
.dec-head h3 code{font-size:11px; font-weight:400; color:var(--c-text-mute);
                  background:none; border:1px solid var(--c-border);
                  border-radius:6px; padding:1px 5px; margin-left:4px}
.dec dl{display:grid; grid-template-columns:auto 1fr; gap:4px var(--s-3); margin:0; font-size:13px}
.dec dt{color:var(--c-text-mute); white-space:nowrap}
.dec dd{margin:0}
.dec .src{margin-top:10px; font-size:11.5px; color:var(--c-text-mute);
           display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.src-link{
  display:inline-flex; align-items:baseline; gap:5px; text-decoration:none;
  border:1px solid var(--c-border); border-radius:var(--r-full);
  padding:2px 9px; color:var(--c-text-dim); max-width:100%;
}
.src-link:hover{border-color:var(--c-accent); color:var(--c-accent)}
.src-link .tag{font-weight:600; white-space:nowrap; font-size:10.5px;
               color:var(--c-text-mute); font-family:var(--font-mono)}
.src-link:hover .tag{color:var(--c-accent)}
.src-link .ttl{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:46ch}

/* 용어 한 줄 — 처음 보는 사람은 recall@5 도 κ 도 모른다. 접어 두면 아무도 안 편다. */
.glossary{
  font-size:12px; color:var(--c-text-mute); margin:0 0 var(--s-3);
  padding-left:10px; border-left:2px solid var(--c-border); line-height:1.6;
}
.glossary b{color:var(--c-text-dim); font-weight:600}
.dec dt{font-family:var(--font-mono); font-size:11.5px; letter-spacing:.01em;
        text-transform:uppercase; padding-top:2px}

.fail{font-size:12.5px; border-left:2px solid var(--c-warn); padding-left:10px; margin:8px 0}
.fail .q{color:var(--c-text-dim)}
.fail .f{color:var(--c-warn); margin-top:2px}

.err{padding:var(--s-4); border:1px solid var(--c-warn); border-radius:var(--r-md); background:var(--c-warn-bg)}
.loading{color:var(--c-text-mute); padding:var(--s-5) 0}

/* 접이식 상세 — 표가 길어 본문을 밀어내면 정작 중요한 절이 스크롤 아래로 사라진다.
   기본은 접고, 펴 볼 수 있게 둔다. */
details.more{margin-top:var(--s-2)}
details.more > summary{
  cursor:pointer; list-style:none; font-size:12.5px; color:var(--c-accent);
  display:inline-flex; align-items:center; gap:5px; padding:4px 0;
}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary::before{content:"▸"; font-size:10px; transition:transform .12s}
details.more[open] > summary::before{transform:rotate(90deg)}
details.more > summary:hover{text-decoration:underline}

/* --- 도입 --------------------------------------------------------------- */
.intro{
  background:var(--c-surface); border:1px solid var(--c-border);
  border-radius:var(--r-lg); padding:var(--s-5); margin-bottom:var(--s-5);
}
.intro p{margin:0 0 var(--s-3); max-width:66ch}
.intro p:last-child{margin-bottom:0}
.intro .thesis{
  border-left:3px solid var(--c-accent); padding-left:var(--s-3);
  color:var(--c-text); font-weight:500;
}
.intro .muted{color:var(--c-text-dim); font-size:14px}

/* --- 장(章) ------------------------------------------------------------- */
.chapter{margin-top:var(--s-6); padding-top:var(--s-5); border-top:1px solid var(--c-border)}
.chapter:first-of-type{border-top:0}
.ch-head{display:flex; gap:var(--s-3); align-items:baseline; margin-bottom:var(--s-4)}
.ch-num{
  flex:0 0 auto; font-family:var(--font-mono); font-size:12px; font-weight:700;
  color:var(--c-accent); background:var(--c-accent-sub);
  border-radius:var(--r-full); padding:3px 10px; letter-spacing:.02em;
}
.ch-head h2{margin:0; font-size:20px}

/* 문제 → 한 일 → 잰 값 → 정한 것.
   ★ 문제를 맨 위에 둔다. 무슨 문제였는지 모르면 측정값을 읽을 수 없다. */
.beats{display:grid; gap:var(--s-3); max-width:74ch}
.beat{display:grid; grid-template-columns:76px 1fr; gap:var(--s-3); align-items:start}
.beat > .k{
  font-size:11px; font-weight:700; letter-spacing:.03em; padding-top:4px;
  color:var(--c-text-mute); text-align:right; white-space:nowrap;
}
.beat > .v{margin:0; line-height:1.7}
.beat.problem > .k{color:var(--c-warn)}
.beat.problem > .v{
  background:var(--c-warn-bg); border-radius:var(--r-md); padding:10px 12px;
  border:1px solid color-mix(in srgb, var(--c-warn) 20%, transparent);
}
.beat.decided > .k{color:var(--c-ok)}
.beat.decided > .v{font-weight:500}
.beat .v b{color:var(--c-text)}
.ch-aside{
  margin-top:var(--s-3); font-size:13px; color:var(--c-text-dim);
  border-left:2px solid var(--c-border); padding-left:var(--s-3); max-width:74ch;
}
.ch-evidence{margin-top:var(--s-4)}
.ch-decisions{margin-top:var(--s-4)}
.ch-decisions > .lead{font-size:12.5px; color:var(--c-text-mute); margin:0 0 var(--s-2)}

.closing{
  margin-top:var(--s-6); padding:var(--s-5); border-radius:var(--r-lg);
  background:var(--c-accent-sub); border:1px solid color-mix(in srgb, var(--c-accent) 22%, transparent);
}
.closing h2{margin:0 0 var(--s-3)}
.closing p{margin:0 0 var(--s-3); max-width:70ch; line-height:1.75}
.closing p:last-child{margin-bottom:0}

/* 최상단 요약 — 30초 훑는 사람이 보는 것은 사실상 이 줄뿐이다 */
.hero{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:var(--s-3); margin:var(--s-5) 0 var(--s-6);
}
.hero .tile{border-left:3px solid var(--c-accent)}
.hero .tile .v{font-size:30px}
.toc{font-size:13px; color:var(--c-text-dim); margin:0 0 var(--s-5)}
.toc a{margin-right:var(--s-3); white-space:nowrap}
</style>
<script>
/* 챗봇 화면에서 고른 화면 밝기를 여기서도 쓴다. 같은 주소이므로 저장값을 공유한다.
   ★ 이 조각은 <head> 안, 화면이 그려지기 전에 돌아야 한다 — 아래쪽에 두면
   밝은 화면이 한 번 번쩍인 뒤 어두워진다. */
try {
  var t = localStorage.getItem('theme');
  document.documentElement.dataset.theme = (t === 'dark' || t === 'light') ? t : 'dark';
} catch (e) { /* 저장소를 못 읽는 환경이면 기본값 그대로 */ }
</script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>만들고, 재고, 다시 잰 기록</h1>
      <p class="lede">
        숫자가 나올 때마다 그 숫자를 의심하고 한 단계씩 더 파고든 과정입니다.
        <b>제 진단이 틀렸던 두 번</b>도 지우지 않고 남겼습니다.
      </p>
    </div>
    <a class="back" id="back" href="/">← 데모로</a>
  </div>

  <div id="stamp" class="stamp">불러오는 중…</div>
  <main id="main"><p class="loading">불러오는 중…</p></main>
</div>

<script>
'use strict';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = v => v == null ? '–' : (v * 100).toFixed(0) + '%';
const f2 = v => v == null ? '–' : Number(v).toFixed(2);
const f3 = v => v == null ? 'n/a' : Number(v).toFixed(3);
/* 아주 작은 마크다운 — **굵게** 와 `코드` 만.
   ★ 반드시 esc() 로 이스케이프한 **뒤에** 태그로 바꾼다. 순서를 바꾸면 데이터에 들어 있는
   HTML 이 그대로 실행된다. 이 페이지는 저장소 안의 JSON 만 읽지만, 렌더러의 안전성은
   입력 출처에 기대면 안 된다. */
const mdLite = s => esc(s)
  .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
  .replace(/`([^`]+)`/g, '<code class="mono">$1</code>');

const el = (tag, cls, html) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
};

/* 표에 쓰는 이름 — **데이터가 아니라 화면에서만** 바꾼다.
   저장된 이름(`vector only` 등)은 회귀 게이트가 줄을 찾는 열쇠라 건드리면 안 된다.
   여기서만 풀어 쓰고 원래 이름은 뒤에 작게 붙인다. */
const ROW_LABEL = {
  'vector only':  ['뜻으로만 찾기', 'vector'],
  'bm25 only':    ['단어로만 찾기', 'BM25'],
  'hybrid RRF':   ['둘을 합쳐 찾기', 'RRF'],
  '+심볼슬롯':     ['함수 이름을 앞자리에', ''],
  '운영 파이프라인': ['실제 서비스가 쓰는 방식', ''],
};

function rowName(name) {
  const m = ROW_LABEL[name];
  if (!m) return esc(name);
  return esc(m[0]) + (m[1] ? ` <span class="term">${esc(m[1])}</span>` : '');
}

/* 검색 평가 — 방식별 비교표. '실제 서비스가 쓰는 방식' 줄을 강조해 무엇이 쓰이는지 보인다. */
function renderRetrieval(list, bare) {
  const sec = el('section');
  sec.innerHTML = bare ? '' :
    '<h2>검색 정확도</h2>' +
    '<p class="sub">같은 질문을 <b>찾는 방식만 바꿔</b> 돌린 결과다. ' +
    '<b>자료 양과 질문 수가 다르면 서로 비교하지 않는다</b> — 아래 네 벌은 각각 다른 조건이다.</p>' +
    '<p class="glossary">' +
    '<b>상위 5건 안에 정답</b> 찾아온 5건 안에 답이 들어 있었는가(높을수록 좋음) <b>recall@5</b> · ' +
    '<b>정답 순위 점수</b> 답이 몇 번째로 나왔는가(1.0 이면 항상 1등) <b>MRR</b> · ' +
    '<b>조각</b> 문서를 검색 단위로 자른 토막<br>' +
    '<b>뜻으로만 찾기</b> 문장의 의미가 비슷한 것을 고른다 · ' +
    '<b>단어로만 찾기</b> 같은 단어가 많이 나오는 것을 고른다 · ' +
    '<b>둘을 합쳐 찾기</b> 두 방식이 각각 뽑은 순위를 합친다 · ' +
    '<b>실제 서비스가 쓰는 방식</b> 여기에 함수 이름 우선 배치와 ' +
    '‘근거가 없으면 답하지 않기’까지 더한 것</p>';

  list.forEach((r, ri) => {
    const card = el('div', 'card');
    const total = (r.corpus.doc || 0) + (r.corpus.code || 0) + (r.corpus.commit || 0);
    const origins = Object.entries(r.origins || {}).map(([k, v]) => `${k} ${v}`).join(' · ');
    card.innerHTML =
      `<h3>${esc(r.label)}</h3>` +
      `<p class="meta">자료 ${total.toLocaleString()}조각 ` +
      `(문서 ${r.corpus.doc || 0} / 코드 ${r.corpus.code || 0} / 변경 이력 ${r.corpus.commit || 0}) · ` +
      `질문 목록 <span class="mono">${esc(r.dataset || '?')}</span>` +
      (origins ? ` · 정답 표시 ${esc(origins)}` : '') + `</p>` +
      `<p class="meta">${esc(r.note)}</p>`;

    // '전체' 스위트는 항상 보이고, 축별 상세는 접는다 — 표가 길어 다음 절을 밀어낸다.
    const table = s => {
      const rows = s.rows.map(x =>
        `<tr class="${x.name === '운영 파이프라인' ? 'best' : ''}">` +
        `<td>${rowName(x.name)}</td>` +
        `<td class="num">${pct(x.recall)}</td>` +
        `<td class="num">${f2(x.mrr)}</td>` +
        `<td class="num">${x.misses}</td></tr>`).join('');
      const tw = el('div', 'tw');
      tw.innerHTML =
        `<table><thead><tr><th>${esc(s.title)} <span class="num">${s.n}문항</span></th>` +
        '<th class="num">상위 5건 안에 정답<span class="term">recall@5</span></th>' +
        '<th class="num">정답 순위 점수<span class="term">MRR</span></th>' +
        '<th class="num">못 찾음</th></tr></thead>' +
        `<tbody>${rows}</tbody></table>`;
      return tw;
    };
    const whole = r.suites.filter(s => s.title === '전체');
    const parts = r.suites.filter(s => s.title !== '전체');
    (whole.length ? whole : r.suites).forEach(s => card.appendChild(table(s)));
    if (whole.length && parts.length) {
      const det = el('details', 'more');
      det.innerHTML = `<summary>종류별로 나눠 보기 (${parts.map(s => esc(s.title)).join(' · ')})</summary>`;
      parts.forEach(s => det.appendChild(table(s)));
      card.appendChild(det);
    }

    const oos = r.out_of_scope || {};
    if (oos.total) {
      card.appendChild(el('div', 'note plain',
        `<b>근거가 없어 답하지 않은 것 ${oos.rejected}/${oos.total}</b> — 찾아온 것이 ` +
        `질문과 충분히 가깝지 않으면 답을 만들기 전에 멈춘다. AI를 아예 부르지 않으므로 ` +
        `말을 지어낼 기회도, 비용도 0 이다.`));
    }
    sec.appendChild(card);
  });
  return sec;
}

/* 채점자 패널 — 이 프로젝트에서 가장 중요한 표. 평균이 아니라 '합의'를 봐야 한다.
   ★ 용어는 '채점자' 하나로 통일한다. 같은 것을 '판정기'와 '채점자'로 번갈아 부르면
      읽는 사람이 둘이 다른 것인 줄 안다 — 어려운 단어보다 이 쪽이 더 해롭다. */
function renderJudges(j, hard, bare) {
  const sec = el('section');
  sec.innerHTML = bare ? '' :
    '<h2>채점하는 AI 자체를 검증했다<span class="num">채점자를 잰다</span></h2>' +
    '<p class="sub">답이 근거에 충실한지를 <b>AI 모델에게 채점시킨다</b>. ' +
    '그 <b>채점을 믿을 수 있는지</b>를 확인하려고, 답과 근거를 ' +
    '<b>고정한 채 채점 모델만</b> 바꿔 봤다. 따라서 아래 차이는 전부 채점자 차이다.</p>' +
    '<p class="glossary">' +
    '<b>self</b> 답을 만든 모델이 자기 답을 채점 · <b>cross</b> 다른 모델이 채점 · ' +
    '<b>평균</b> 답에서 한 말 중 근거에 실제로 있는 것의 비율' +
    '(1.0 = 지어낸 말 없음) <b>groundedness</b> · ' +
    '<b>지어냈다고 본 비율</b> 채점자가 감점한 문항의 비율<br>' +
    '<b>Cohen&rsquo;s κ</b> 두 채점자가 <b>같은 문항</b>을 같게 봤는지 ' +
    '— 1.0 완전 일치 · 0 우연 수준 · 음수는 우연보다 못함</p>';

  const panel = (d, title, note) => {
    if (!d) return null;
    const card = el('div', 'card');
    const rows = d.judges.map(x =>
      `<tr><td class="mono">${esc(x.judge)}</td>` +
      `<td><span class="pill ${x.self_judge ? 'warn' : 'info'}">${x.self_judge ? 'self' : 'cross'}</span></td>` +
      `<td class="num">${x.n}</td><td class="num">${f3(x.mean)}</td>` +
      `<td class="num">${pct(x.flag_rate)}</td></tr>`).join('');
    // κ 는 계산 가능한 쌍만. n/a 는 '한쪽이 전 문항 같은 판정' 이라는 뜻이라 그대로 표기한다.
    const ks = d.pairs.filter(p => p.kappa != null);
    const kmin = ks.length ? Math.min(...ks.map(p => p.kappa)) : null;
    const kmax = ks.length ? Math.max(...ks.map(p => p.kappa)) : null;
    card.innerHTML =
      `<h3>${esc(title)}</h3><p class="meta">${esc(note)}</p>` +
      `<div class="tw"><table><thead><tr><th>채점자</th><th>종류</th>` +
      `<th class="num">채점</th><th class="num">평균</th>` +
      `<th class="num">지어냈다고 본 비율</th>` +
      `</tr></thead><tbody>${rows}</tbody></table></div>`;
    if (ks.length) {
      card.appendChild(el('div', 'note',
        `<b>평균은 모였는데 합의는 없다.</b> 문항 단위 일치도(Cohen&rsquo;s κ)가 ` +
        `${f3(kmin)} ~ ${f3(kmax)} 로 <b>전부 음수</b> — 우연히 맞추는 것보다 못하다. ` +
        `즉 채점자들은 &ldquo;몇 점인가&rdquo;에는 비슷하게 답하지만 ` +
        `&ldquo;<b>어느 답이 지어낸 것인가</b>&rdquo;에는 한 문항도 뜻이 모이지 않았다. ` +
        `평균이 모인 건 채점자가 견고해서가 아니라 <b>거의 다 만점이라 ` +
        `차이가 드러날 자리가 없었기</b> 때문이다(천장 효과).`));
    } else {
      card.appendChild(el('div', 'note plain',
        `κ 를 계산할 수 있는 쌍이 없다 — 한쪽 채점자가 전 문항에 같은 점수를 줬다는 뜻이고, ` +
        `그 자체가 &ldquo;변별하지 못한다&rdquo;는 결과다.`));
    }
    return card;
  };

  const a = panel(j, '평범한 문항 16개', '골든셋에서 뽑은 답변을 채점자 5종에 걸었다.');
  if (a) sec.appendChild(a);
  const b = panel(hard, '일부러 함정을 판 질문 19개',
    '"평가셋이 쉬워서"라는 가설을 확인하려고 어려운 문항으로 다시 걸었다.');
  if (b) sec.appendChild(b);

  if (j && hard) {
    sec.appendChild(el('div', 'note',
      `<b>가설이 틀렸다.</b> 문항을 어렵게 만들어도 값이 움직이지 않았다. ` +
      `원인은 문항이 아니라 <b>채점 기준 자체</b>였다 — 답을 거절하면 지어낸 말이 하나도 없으므로 ` +
      `<b>자동으로 만점</b>이다. 이 기준은 &lsquo;지어냈는가&rsquo;가 아니라 ` +
      `&lsquo;한 말이 근거에 있는가&rsquo;를 재고, <b>말하지 않아서 얻는 만점</b>을 구분하지 못한다. ` +
      `→ 그래서 아래의 <b>행동 기반 채점</b>으로 지표를 바꿨다.`));
  }
  if (j && j.caveat) {
    sec.appendChild(el('div', 'note plain', esc(j.caveat)));
  }
  return sec;
}

/* 적대적 평가 — 지표를 바꾸고 나서야 변별했다는 것을 보이는 자리. 실패 사례를 숨기지 않는다. */
function renderHard(h, bare) {
  const sec = el('section');
  // 덫 이름을 영어 그대로 두면(absent/partial/superseded) 처음 보는 사람은 못 읽는다.
  const kname = {absent: '없는 것을 물음', partial: '절반만 근거 있음',
                 superseded: '옛 값 유도'};
  const label = {absent: '기록에 없는 사실을 묻는다', partial: '한쪽만 답할 수 있다',
                 superseded: '바뀌기 전 값이 튀어나오기 쉽다'};
  const right = {absent: '없다고 밝혀야 통과', partial: '있는 쪽만 답해야 통과',
                 superseded: '현재 값을 답해야 통과'};
  sec.innerHTML = bare ? '' :
    '<h2>일부러 함정을 파고, 행동으로 채점했다<span class="num">질문 ' + h.n + '개</span></h2>' +
    '<p class="sub">답이 <b>없거나 절반만 있는</b> 질문을 일부러 만들어, 시스템이 ' +
    '지어내는지 봤다. 함정 종류마다 <b>통과 조건을 따로</b> 뒀다 — 위의 채점 기준으로 재면 ' +
    '아래 실패가 0.99 로 묻힌다(거절하면 지어낸 말이 없어 자동으로 만점이라서).</p>' +
    '<p class="glossary">질문은 AI가 만들고, <b>만든 모델과 다른 모델</b>이 ' +
    '&ldquo;정말 근거가 없는지&rdquo;를 확인해 걸러 냈다 — 근거가 있는 질문이 섞이면 ' +
    '옳게 답한 시스템을 틀렸다고 채점하게 된다.</p>';

  const tiles = el('div', 'tiles');
  tiles.innerHTML =
    `<div class="tile"><div class="v">${pct(h.pass_rate)}</div><div class="k">전체 통과율</div>` +
    `<div class="n">나머지는 지어낸 답이다</div></div>` +
    Object.entries(h.by_kind).map(([k, v]) =>
      `<div class="tile"><div class="v">${pct(v.pass_rate)}</div>` +
      `<div class="k">${esc(kname[k] || k)} · ${v.pass}/${v.n}</div>` +
      `<div class="n">${esc(label[k] || '')} → ${esc(right[k] || '')}</div></div>`).join('');
  sec.appendChild(tiles);

  const rl = h.rule_vs_llm || {};
  if (rl.n) {
    sec.appendChild(el('div', 'note plain',
      `<b>규칙 기반 채점은 쓸 수 없다.</b> &lsquo;거절 어휘가 있는가&rsquo;(정규식)로 세면 ` +
      `${rl.rule_pass}/${rl.n}, 실제로 지어냈는지 판정하면 ${rl.llm_pass}/${rl.n} — ` +
      `일치율 ${pct(rl.agreement)}. 어긋나는 쪽은 &ldquo;확인되지 않으나 값은 …입니다&rdquo;처럼 ` +
      `<b>거절 어휘를 쓰면서 동시에 지어내는</b> 답변이다.`));
  }

  if (h.failures && h.failures.length) {
    const card = el('div', 'card');
    card.innerHTML = '<h3>실제로 지어낸 사례</h3>' +
      '<p class="meta">잘 되는 것만 보여주면 데모가 된다. 틀린 것을 같이 싣는다.</p>';
    h.failures.forEach(f => {
      card.appendChild(el('div', 'fail',
        `<span class="pill warn">${esc(kname[f.kind] || f.kind)}</span> ` +
        `<span class="q">${mdLite(f.q)}</span>` +
        (f.fabricated || []).map(x => `<div class="f">지어냄: ${esc(x)}</div>`).join('')));
    });
    sec.appendChild(card);
  }
  return sec;
}

/* ANN 임계 — 브루트포스가 의도된 선택임을 수치로. 합성/실측을 나눈 이유도 함께. */
function renderAnn(a, bare) {
  const sec = el('section');
  sec.innerHTML = bare ? '' :
    '<h2>전부 하나씩 비교하는 방식은 언제까지 버티나' +
      '<span class="num">자료를 키워 가며 실측</span></h2>' +
    '<p class="sub">질문과 자료를 숫자 묶음으로 바꿔 견주는데, 그걸 <b>자료 전부와 하나씩</b> ' +
    '비교한다. 보통은 일부만 훑는 빠른 방식을 쓰는데, 그렇게 안 한 것이 게으름이 아니라 ' +
    '선택임을 자료를 키워 가며 쟀다.</p>' +
    '<p class="glossary">' +
    '<b>자료 조각 수</b> 검색 대상이 몇 토막인지 <b>N</b> · ' +
    '<b>보통 걸린 시간 / 느린 편</b> 한 번 검색에 걸린 시간의 중앙값 / 상위 5% ' +
    '<b>p50 / p95</b> · ' +
    '<b>일부만 훑는 빠른 방식</b> 널리 쓰이는 대표 알고리즘 <b>HNSW</b> · ' +
    '<b>얼마나 넓게 훑나</b> 클수록 정확하고 느리다 <b>ef_search</b></p>';

  const card = el('div', 'card');
  card.innerHTML =
    '<h3>자료가 늘면 얼마나 느려지고 얼마나 무거워지나 ' +
      '<span class="pill info">지어낸 데이터로 측정</span></h3>' +
    '<p class="meta">행렬곱 비용은 값이 아니라 <b>모양</b>이 정하므로 이 목적에는 합성으로 충분하다.</p>' +
    '<div class="tw"><table><thead><tr><th class="num">N</th><th class="num">행렬</th>' +
    '<th class="num">보통 걸린 시간<span class="term">p50</span></th>' +
    '<th class="num">느린 편<span class="term">p95</span></th></tr></thead><tbody>' +
    a.scaling.map(r =>
      `<tr><td class="num">${r.n.toLocaleString()}</td>` +
      `<td class="num">${Math.round(r.mb).toLocaleString()} MB</td>` +
      `<td class="num">${f2(r.p50)} ms</td><td class="num">${f2(r.p95)} ms</td></tr>`).join('') +
    '</tbody></table></div>';
  const last = a.scaling[a.scaling.length - 1];
  if (last) {
    card.appendChild(el('div', 'note plain',
      `자료 ${last.n.toLocaleString()}조각에서도 ${f2(last.p50)}밀리초 — AI가 첫 글자를 뱉기까지 ` +
      `걸리는 시간(약 1.4초)의 <b>${(last.p50 / 1400 * 100).toFixed(1)}%</b> 다. ` +
      `<b>먼저 한계에 닿는 것은 속도가 아니라 메모리</b>이고, ` +
      `100만 조각이면 ${Math.round(last.mb * 10 / 1000)} GB 가 된다.`));
  }
  sec.appendChild(card);

  if (a.real) {
    const c2 = el('div', 'card');
    c2.innerHTML =
      '<h3>빠르게 찾는 방식으로 바꾸면 무엇을 잃나' +
        '<span class="term">HNSW</span> <span class="pill ok">실제 데이터로 측정</span></h3>' +
      `<p class="meta">실제 자료 ${a.real.n.toLocaleString()}조각 · 실제 질문 ${a.real.n_queries}개. ` +
      '아래 비율은 <b>하나도 빠짐없이 다 뒤졌을 때 고른 것</b>과 얼마나 같은지다.</p>' +
      '<div class="tw"><table><thead><tr>' +
        '<th class="num">얼마나 넓게 훑나<span class="term">ef_search</span></th>' +
        '<th class="num">빠른 방식</th><th class="num">다 뒤지기</th>' +
        '<th class="num">같은 결과 비율</th></tr></thead><tbody>' +
      a.real.sweep.map(r =>
        `<tr><td class="num">${r.ef_search}</td><td class="num">${f2(r.p50_ms)} ms</td>` +
        `<td class="num">${f2(a.real.brute_p50)} ms</td>` +
        `<td class="num">${pct(r.recall_at_k)}</td></tr>`).join('') +
      '</tbody></table></div>';
    c2.appendChild(el('div', 'note',
      `<b>지어낸 데이터로는 이 값을 재면 안 된다.</b> 같은 실험을 지어낸 데이터로 하면 ` +
      `같은 결과를 찾아내는 비율이 0~19% 로 나온다. 무작위로 만든 숫자 묶음은 서로 ` +
      `<b>고르게 멀어서 '가까운 이웃'이라는 게 사실상 없기</b> 때문이다. ` +
      `빠른 방식은 가까운 것끼리 이어 둔 그물을 따라가며 찾으므로, 따라갈 이웃이 없으면 ` +
      `성립하지 않는다. 그건 <b>그 방식의 성질이 아니라 데이터의 성질</b>이다 — ` +
      `그대로 실었으면 &ldquo;빠른 방식은 못 쓴다&rdquo;는 정반대 결론이 나왔다.`));
    sec.appendChild(c2);
  }
  return sec;
}

/* 채택/기각한 판단 — 이 페이지의 결론부. '해봤다'가 아니라 '재고 정했다'. */
function renderDecisions(list) {
  const sec = el('section');
  const nRej = list.filter(d => d.verdict.includes('기각')).length;
  sec.innerHTML =
    `<h2>측정하고 정한 것<span class="num">${list.length}건 중 ${nRej}건이 기각</span></h2>` +
    '<p class="sub">기술을 <b>붙였다</b>가 아니라 <b>재고 정했다</b>가 이 목록의 존재 이유다. ' +
    '기각한 것을 같이 싣는 이유는, 채택만 나열하면 무엇을 근거로 골랐는지 알 수 없기 때문이다.</p>' +
    // 항목 이름이 한글이 되어 그 설명은 필요 없어졌다. 대신 카드 안에 되풀이해서
    // 나오는 **숫자의 이름**을 한 줄로 풀어 둔다 — 접어 두면 아무도 안 편다.
    '<p class="glossary">숫자에 붙은 이름: ' +
    '<b>recall@5</b> 찾아야 할 것을 상위 5건 안에서 찾아낸 비율 · ' +
    '<b>MRR</b> 정답이 몇 번째로 나왔는지의 점수(1 에 가까울수록 위쪽) · ' +
    '<b>κ</b> 채점자들이 얼마나 같게 봤는지(0 이면 찍은 것과 같음). ' +
    '맨 아래 링크는 그 판단이 기록된 노트나 커밋이다.</p>';

  list.forEach(d => sec.appendChild(decisionCard(d)));
  return sec;
}

/* 판단 카드 하나. 순서가 중요하다 — **Problem 을 맨 위에** 둔다.
   무슨 문제였는지 모르는 채로 측정값을 먼저 보면 "이걸 왜 쟀지?" 를 스스로 채워야 한다. */
function decisionCard(d) {
  const rejected = d.verdict.includes('기각');
  const card = el('div', 'card dec ' + (rejected ? 'reject' : 'adopt'));
  card.innerHTML =
    // 제목에도 `백틱` 안의 원래 용어를 살린다 — 본문만 살리면 제목에서 백틱이
    // 글자 그대로 보인다(실제로 그렇게 보였다).
    `<div class="dec-head"><h3>${mdLite(d.title)}</h3>` +
    `<span class="pill ${rejected ? 'warn' : 'ok'}">${esc(d.verdict)}</span></div>` +
    `<dl>` +
    // 항목 이름이 Problem/Measured/Why/Decision 이었다. 카드 안의 용어를 걷어내면서
    // 정작 **틀의 이름이 영어**로 남아 있었다 — 처음 보는 사람은 거기서 먼저 막힌다.
    (d.problem ? `<dt>무슨 문제였나</dt><dd>${mdLite(d.problem)}</dd>` : '') +
    // 이제 숫자만이 아니라 문장이라 고정폭 글꼴을 쓰지 않는다. 용어는 `백틱`으로
    // 감싸 그 부분만 고정폭이 되고, 앞의 풀어 쓴 말이 먼저 읽힌다.
    `<dt>재보니</dt><dd>${mdLite(d.measured)}</dd>` +
    `<dt>왜 그랬나</dt><dd>${mdLite(d.why)}</dd>` +
    `<dt>그래서</dt><dd>${mdLite(d.action)}</dd>` +
    `</dl>` +
    // 근거는 번호가 아니라 **제목**으로 보여주고 원문으로 링크한다.
    // '노트 #7' 은 처음 보는 사람에게 아무 뜻도 없는 기호다.
    ((d.notes && d.notes.length)
      ? `<div class="src">` + d.notes.map(n =>
          `<a class="src-link" href="${esc(n.url)}" target="_blank" rel="noopener">` +
          `<span class="tag">${esc(n.label)}</span>` +
          `<span class="ttl">${esc(n.title)}</span></a>`).join('') + `</div>`
      : '');
  return card;
}

/* 장이 참조하는 근거를 무엇으로 그릴지. 표를 뒤로 몰지 않고 **그 장 안에** 붙인다. */
const EVIDENCE = {
  private:          d => pickRetrieval(d, 'private'),
  'eval-synthetic': d => pickRetrieval(d, 'eval-synthetic'),
  judges:           d => (d.judges || d.judges_hard) ? renderJudges(d.judges, d.judges_hard, true) : null,
  hard:             d => d.hard ? renderHard(d.hard, true) : null,
  ann:              d => d.ann ? renderAnn(d.ann, true) : null,
};

function pickRetrieval(d, key) {
  const one = (d.retrieval || []).filter(r => r.key === key);
  return one.length ? renderRetrieval(one, true) : null;
}

/* 도입 — 이게 무엇인지 어려운 말 없이. 이걸 안 두면 숫자부터 보게 된다. */
function renderIntro(intro) {
  const box = el('section', 'intro');
  box.innerHTML =
    `<p>${mdLite(intro.what)}</p>` +
    `<p class="muted">${mdLite(intro.example)}</p>` +
    `<p>${mdLite(intro.twist)}</p>` +
    `<p class="thesis">${mdLite(intro.thesis)}</p>`;
  return box;
}

/* 장 하나 — 문제 → 한 일 → 잰 값 → 정한 것, 그리고 그 자리에 근거를 붙인다. */
function renderChapter(ch, data) {
  const sec = el('section', 'chapter');
  sec.innerHTML =
    `<div class="ch-head"><span class="ch-num">${ch.n}장</span>` +
    `<h2>${esc(ch.title)}</h2></div>`;

  const beats = el('div', 'beats');
  const beat = (cls, key, text) => {
    if (!text) return;
    const b = el('div', 'beat ' + cls);
    // 줄바꿈은 문단으로 — 한 덩어리로 붙으면 '그런데' 이후가 안 보인다.
    b.innerHTML = `<div class="k">${esc(key)}</div><div class="v">` +
      String(text).split('\n').map(t => `<p style="margin:0 0 6px">${mdLite(t)}</p>`).join('') +
      `</div>`;
    beats.appendChild(b);
  };
  beat('problem', '무슨 문제', ch.problem);
  beat('did', '한 일', ch.did);
  beat('measured', '잰 값', ch.measured);
  beat('decided', '정한 것', ch.decided);
  sec.appendChild(beats);

  if (ch.aside) sec.appendChild(el('div', 'ch-aside', mdLite(ch.aside)));

  // 근거를 이 자리에 붙인다. 뒤로 몰면 서술에서 떨어져 나간다.
  const ev = EVIDENCE[ch.evidence];
  if (ev) {
    const box = el('div', 'ch-evidence');
    const node = ev(data);
    if (node) box.appendChild(node);
    sec.appendChild(box);
  }

  const picked = (ch.decisions || [])
    .map(t => (data.decisions || []).find(d => d.title === t))
    .filter(Boolean);
  if (picked.length) {
    const box = el('div', 'ch-decisions');
    box.appendChild(el('p', 'lead',
      '이 장에서 붙였다가 <b>재 보고 정한</b> 것 ' + picked.length + '건'));
    picked.forEach(d => box.appendChild(decisionCard(d)));
    sec.appendChild(box);
  }
  return sec;
}

function renderClosing(c) {
  const box = el('section', 'closing');
  box.innerHTML = `<h2>${esc(c.title)}</h2>` +
    String(c.body).split('\n\n').map(t => `<p>${mdLite(t)}</p>`).join('');
  return box;
}

/* 최상단 요약 — 이 페이지에서 딱 한 줄만 읽는다면 이것이어야 한다. */
function renderHero(d) {
  const box = el('div');
  const nDec = (d.decisions || []).length;
  const nRej = (d.decisions || []).filter(x => x.verdict.includes('기각')).length;
  const priv = (d.retrieval || []).find(r => r.key === 'private');
  const whole = priv && priv.suites.find(s => s.title === '전체');
  const op = whole && whole.rows.find(r => r.name === '운영 파이프라인');
  const base = whole && whole.rows.find(r => r.name === 'vector only');
  const ks = ((d.judges || {}).pairs || []).filter(p => p.kappa != null).map(p => p.kappa);

  const tiles = [];
  if (op && base) {
    tiles.push([`${pct(base.recall)}→${pct(op.recall)}`,
                '찾아야 할 것을 실제로 찾은 비율<span class="term">recall@5</span>',
                '뜻으로만 찾을 때 → 뜻과 단어를 함께 쓸 때. 자료 3,619조각 · 질문 28개']);
  }
  if (d.hard) {
    tiles.push([pct(d.hard.pass_rate), '일부러 함정을 판 질문에 옳게 답한 비율',
                `질문 ${d.hard.n}개. 말을 지어냈는지를 행동으로 채점한다 — ` +
                '예전 지표로는 가려지지 않았다']);
  }
  if (ks.length) {
    tiles.push([f3(Math.max(...ks)),
                '채점자들이 같은 답을 두고 뜻을 모은 정도<span class="term">κ</span>',
                '찍는 것만도 못하다. 평균 점수는 같아도 ' +
                '어느 답이 지어낸 것인지에는 뜻이 모이지 않았다']);
  }
  if (nDec) {
    tiles.push([`${nRej}/${nDec}`, '재어 보고 그만둔 판단',
                '근거 다시 고르기 · 한국어 단어 분석기 · 성능 재는 방법 등']);
  }
  const hero = el('div', 'hero');
  // 제목에만 <span class="term"> 을 허용한다. 값·설명은 그대로 escape 한다 —
  // 여기 들어오는 것은 우리가 쓴 문자열이지 사용자 입력이 아니다.
  hero.innerHTML = tiles.map(([v, k, n]) =>
    `<div class="tile"><div class="v">${esc(v)}</div><div class="k">${k}</div>` +
    `<div class="n">${esc(n)}</div></div>`).join('');
  box.appendChild(hero);
  return box;
}

/* 이 페이지는 **두 곳**에서 열린다 — 그래서 데이터를 두 자리에서 찾는다.

     1. 앱 서버:      /eval        → /eval/summary  (app/main.py 가 파일을 읽어 돌려줌)
     2. GitHub Pages: /<repo>/     → summary.json   (같은 폴더에 복사해 둔 것)

   Pages 에는 앱이 없다. 그래서 첫 주소가 404 로 떨어지고 두 번째에서 잡힌다.
   ★ 파일을 두 벌로 갈라 두지 않는 이유 — 갈라 두면 한쪽만 고치는 날이 반드시 온다.
     헛치는 요청 한 번이 그것보다 싸다. */
const SUMMARY_SOURCES = ['/eval/summary', 'summary.json'];

async function loadSummary() {
  let last = null;
  for (const url of SUMMARY_SOURCES) {
    try {
      const res = await fetch(url);
      if (!res.ok) { last = new Error(`${url} → HTTP ${res.status}`); continue; }
      const data = await res.json();
      // 앱 없이 열렸다면 '데모로' 돌아갈 곳이 없다 — 저장소로 보낸다.
      if (url !== SUMMARY_SOURCES[0]) {
        const back = document.getElementById('back');
        if (back) {
          back.href = 'https://github.com/ae-GYEONGWON/codebase-rag-assistant';
          back.textContent = '← 저장소로';
        }
      }
      return data;
    } catch (e) { last = e; }
  }
  throw last || new Error('스냅샷을 찾지 못했습니다.');
}

async function main() {
  const stamp = document.getElementById('stamp');
  const root = document.getElementById('main');
  let d;
  try {
    d = await loadSummary();
  } catch (e) {
    root.innerHTML = `<div class="err">측정 결과를 불러오지 못했습니다: ${esc(e.message)}</div>`;
    stamp.textContent = '';
    return;
  }
  if (d.error) {
    root.innerHTML = `<div class="err">${esc(d.error)}</div>`;
    stamp.textContent = '';
    return;
  }

  // 스냅샷이라는 사실을 먼저 밝힌다 — 수치에 조건을 붙여 말하는 것이 이 프로젝트의 원칙이다.
  stamp.innerHTML =
    `이 페이지의 숫자는 <b>그때 재서 저장해 둔 것</b>이다 — 지금 다시 잰 값이 아니다. ` +
    `잰 때 ${esc((d.generated_at || '').replace('T', ' ').slice(0, 16))}` +
    (d.git_sha ? ` · 커밋 <code>${esc(d.git_sha)}</code>` : '');

  root.innerHTML = '';

  // 순서 = 이야기 순서. 사실을 종류별로 모아 두면 각 조각은 맞는데 **왜 그 순서인지**가
  // 없어서, 읽는 사람이 흐름을 스스로 만들어야 한다.
  const story = d.story || {};
  if (story.intro) root.appendChild(renderIntro(story.intro));
  root.appendChild(renderHero(d));

  const chapters = story.chapters || [];
  chapters.forEach(ch => root.appendChild(renderChapter(ch, d)));
  if (story.closing) root.appendChild(renderClosing(story.closing));

  // 장에서 다루지 않은 나머지는 뒤에 모아 둔다 — 조용히 사라지면 안 된다.
  const shown = new Set(chapters.flatMap(c => c.decisions || []));
  const rest = (d.decisions || []).filter(x => !shown.has(x.title));
  if (rest.length) root.appendChild(renderDecisions(rest));

  const usedEv = new Set(chapters.map(c => c.evidence).filter(Boolean));
  const restRet = (d.retrieval || []).filter(r => !usedEv.has(r.key));
  if (restRet.length) {
    const more = el('details', 'more');
    more.innerHTML = `<summary>나머지 평가셋 ${restRet.length}벌도 보기</summary>`;
    more.appendChild(renderRetrieval(restRet, true));
    root.appendChild(more);
  }
}

main();
</script>
</body>
</html>
